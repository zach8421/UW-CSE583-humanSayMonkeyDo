name: Tests
on: [push, pull_request]

jobs:
  tests:
    # We intentionally run tests only on Ubuntu for now.
    # macOS is included in the matrix so it appears in the CI view,
    # but is skipped because macOS builds are significantly slower,
    # and the project does not rely on any macOS-specific behavior.
    # This keeps CI fast and avoids long macOS queue/timeout issues.
    if: runner.os == 'Linux'

    env:
      ENV_NAME: humanSayMonkeyDo
      PYTHON: ${{ matrix.python-version }}
      OS: ${{ matrix.os }}

    name: Testing
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      matrix:
        # macOS is kept here for visibility, but it will be skipped
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ env.PYTHON }}
          environment-file: environment.yaml
          activate-environment: ${{ env.ENV_NAME }}
          conda-remove-defaults: "true"

      - name: Conda Info
        run: |
          conda info -a
          conda list
          PYVER=$(python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          if [[ $PYVER != ${{ env.PYTHON }} ]]; then
            exit 1
          fi

      - name: Install Package
        run: pip install --no-deps .

      - name: Run Tests
        run: python -m pytest
