name: Tests
on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    env:
      ENV_NAME: humanSayMonkeyDo
      PYTHON: ${{ matrix.python-version }}
      OS: ${{ matrix.os }}

    name: Testing
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11","3.12","3.13"]
    steps:
      - name: Skip macOS runners
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          echo "Skipping macOS because it is slow and unnecessary for this project."
          exit 0

      - uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ env.PYTHON }}
          environment-file: environment.yaml
          activate-environment: ${{ env.ENV_NAME }}
          conda-remove-defaults: "true"

      - name: Conda Info
        run: |
          conda info -a
          conda list
          PYVER=`python -c "import sys; print('{:d}.{:d}'.format(sys.version_info.major, sys.version_info.minor))"`
          echo "Detected Python: $PYVER  Expected: ${PYTHON}"
          if [[ $PYVER != ${{ env.PYTHON }} ]]; then
            echo "Python version mismatch"
            exit 1;
          fi

      - name: Install
        run: pip install --no-deps .

      - name: Run Tests
        run: |
          python -m pytest
